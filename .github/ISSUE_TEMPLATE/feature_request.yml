name: Feature request
description: Propose an improvement with a concrete use case.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Describe the task you cannot complete today. Use synthetic examples without private deployment details.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain the desired result and any alternatives you considered.
    validations:
      required: true
