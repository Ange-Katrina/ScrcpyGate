name: Builds

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: builds-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: Source and workflow checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      image: ${{ steps.metadata.outputs.image }}
      publish: ${{ steps.metadata.outputs.publish }}
      tags: ${{ steps.metadata.outputs.tags }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Install check dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check source syntax and repository boundaries
        run: |
          python tools/ci.py check-files
          python -m ruff check --no-cache app adb_manager.py scrcpy.py tools
          while IFS= read -r -d '' file; do node --check "$file"; done < <(git ls-files -z 'static/*.js' 'static/**/*.js')
          for file in deploy.sh docker-entrypoint.sh tools/*.sh; do sh -n "$file"; done
          git diff --check
      - name: Validate both Compose deployment modes
        run: |
          docker compose --env-file .env.example config --quiet
          docker compose --env-file .env.example -f compose.host.yaml config --quiet
      - name: Audit runtime dependencies
        run: pip-audit -r requirements.txt --progress-spinner off
      - name: Install verified workflow and secret scanners
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/ci-tools"
          cd "$RUNNER_TEMP/ci-tools"
          gh release download v1.7.12 --repo rhysd/actionlint \
            -p actionlint_1.7.12_linux_amd64.tar.gz -p actionlint_1.7.12_checksums.txt
          sha256sum --check --ignore-missing actionlint_1.7.12_checksums.txt
          tar -xzf actionlint_1.7.12_linux_amd64.tar.gz actionlint
          gh release download v8.30.1 --repo gitleaks/gitleaks \
            -p gitleaks_8.30.1_linux_x64.tar.gz -p gitleaks_8.30.1_checksums.txt
          sha256sum --check --ignore-missing gitleaks_8.30.1_checksums.txt
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          echo "$RUNNER_TEMP/ci-tools" >> "$GITHUB_PATH"
      - name: Validate Actions and scan reachable history
        run: |
          actionlint -shellcheck= -pyflakes=
          gitleaks git . --log-opts=--all --redact=100 --no-banner
      - name: Resolve publication metadata
        id: metadata
        run: python tools/ci.py metadata

  verify:
    name: Verify image (${{ matrix.arch }})
    needs: checks
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build a local image for native validation
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          provenance: false
          sbom: false
          # The checked-in version plus a development suffix, or the exact release version.
          build-args: |
            SCRCPYGATE_VERSION=${{ needs.checks.outputs.version }}
          tags: scrcpygate-ci:${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.checks.outputs.version }}
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha,scope=verified-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=verified-${{ matrix.arch }}
      - name: Check bridge and host-network startup
        env:
          IMAGE: scrcpygate-ci:${{ matrix.arch }}
          EXPECTED_VERSION: ${{ needs.checks.outputs.version }}
        run: sh tools/ci_smoke.sh "$IMAGE"
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567
        with:
          version: v0.74.0
      - name: Scan the exact local image
        env:
          IMAGE: scrcpygate-ci:${{ matrix.arch }}
        run: |
          trivy image --image-src docker --scanners vuln --pkg-types os \
            --severity CRITICAL --ignore-unfixed --exit-code 1 --no-progress "$IMAGE"
      - name: Export the verified image and SBOM
        if: needs.checks.outputs.publish == 'true'
        env:
          IMAGE: scrcpygate-ci:${{ matrix.arch }}
        run: |
          mkdir -p "$RUNNER_TEMP/verified"
          trivy image --image-src docker --format spdx-json --no-progress \
            --output "$RUNNER_TEMP/verified/sbom.spdx.json" "$IMAGE"
          docker save "$IMAGE" -o "$RUNNER_TEMP/verified/image.tar"
          cd "$RUNNER_TEMP/verified"
          sha256sum image.tar sbom.spdx.json > SHA256SUMS
      - name: Transfer the verified artifact to publication
        if: needs.checks.outputs.publish == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-image-${{ matrix.arch }}
          path: ${{ runner.temp }}/verified/
          retention-days: 1
          compression-level: 1
          if-no-files-found: error

  publish:
    name: Publish verified images to GHCR
    needs: [checks, verify]
    if: needs.checks.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # The workflow serializes each ref. A shared publication group would
    # cancel pending releases when another branch or tag finishes testing.
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE_REPO: ${{ needs.checks.outputs.image }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: verified-image-*
          path: ${{ runner.temp }}/images
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Load the images that passed verification
        run: |
          for arch in amd64 arm64; do
            dir="$RUNNER_TEMP/images/verified-image-$arch"
            (cd "$dir" && sha256sum --check SHA256SUMS)
            docker load -i "$dir/image.tar"
            revision=$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "scrcpygate-ci:$arch")
            test "$revision" = "$GITHUB_SHA"
            test "$(docker inspect --format '{{.Architecture}}' "scrcpygate-ci:$arch")" = "$arch"
          done
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push verified artifacts and assemble a candidate index
        id: candidate
        run: |
          refs=()
          for arch in amd64 arm64; do
            ref="$IMAGE_REPO:build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$arch"
            docker tag "scrcpygate-ci:$arch" "$ref"
            docker push "$ref"
            digest=$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' | jq -r .digest)
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            echo "$arch=$digest" >> "$GITHUB_OUTPUT"
            refs+=("$IMAGE_REPO@$digest")
          done
          candidate="$IMAGE_REPO:build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          docker buildx imagetools create --tag "$candidate" "${refs[@]}"
          digest=$(docker buildx imagetools inspect "$candidate" --format '{{json .Manifest}}' | jq -r .digest)
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Attest the multi-platform image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_REPO }}
          subject-digest: ${{ steps.candidate.outputs.digest }}
          push-to-registry: true
      - name: Attest the amd64 SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_REPO }}
          subject-digest: ${{ steps.candidate.outputs.amd64 }}
          sbom-path: ${{ runner.temp }}/images/verified-image-amd64/sbom.spdx.json
          push-to-registry: true
      - name: Attest the arm64 SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_REPO }}
          subject-digest: ${{ steps.candidate.outputs.arm64 }}
          sbom-path: ${{ runner.temp }}/images/verified-image-arm64/sbom.spdx.json
          push-to-registry: true
      - name: Promote the verified index to public release tags
        id: promote
        env:
          IMAGE_TAGS: ${{ needs.checks.outputs.tags }}
          DIGEST: ${{ steps.candidate.outputs.digest }}
        run: |
          args=()
          while IFS= read -r tag; do
            [ -z "$tag" ] || args+=(--tag "$tag")
          done <<< "$IMAGE_TAGS"
          test "${#args[@]}" -gt 0
          docker buildx imagetools create "${args[@]}" "$IMAGE_REPO@$DIGEST"
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            actual=$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest}}' | jq -r .digest)
            test "$actual" = "$DIGEST"
          done <<< "$IMAGE_TAGS"
      - name: Summarize publication
        if: always()
        env:
          PUBLICATION_STATUS: ${{ job.status }}
          PROMOTION_OUTCOME: ${{ steps.promote.outcome }}
          CANDIDATE_OUTCOME: ${{ steps.candidate.outcome }}
          IMAGE_TAGS: ${{ needs.checks.outputs.tags }}
          DIGEST: ${{ steps.candidate.outputs.digest }}
        run: |
          {
            echo '## GHCR publication'
            echo
            printf 'Status: **%s**\n\n' "$PUBLICATION_STATUS"
            printf 'Source commit: `%s`\n\n' "$GITHUB_SHA"
            echo 'Both architectures passed bridge/host-network startup and image scanning.'
            if [ "$PROMOTION_OUTCOME" = success ]; then
              printf '\nImage: `%s@%s`\n\n' "$IMAGE_REPO" "$DIGEST"
              printf 'Published tags:\n```text\n%s\n```\n' "$IMAGE_TAGS"
              echo 'Deploy this digest manually; no server connection is made by this workflow.'
            else
              echo
              echo 'Publication did not complete. Check the failed step before deploying this run.'
              if [ "$CANDIDATE_OUTCOME" = failure ]; then
                echo
                echo 'If the push reports `permission_denied: write_package`:'
                echo "1. Open the container package settings under the owner's Packages tab."
                echo '2. In **Manage Actions access**, grant the current repository **Write** access.'
                echo '3. Check **Connect repository**, especially after deleting and recreating a repository.'
                echo '4. Re-run failed jobs while the verified artifacts remain available (one day); otherwise re-run all jobs.'
                echo
                echo 'The workflow already uses `GITHUB_TOKEN` with `packages: write`; this does not override existing package access rules.'
              fi
              printf '\n[Publication and recovery guide](%s/%s/blob/%s/docs/deployment/ci-cd.md)\n' \
                "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_SHA"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
