name: Builds

on:
  push:
    branches:
      - main
      - dev
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: builds-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: scrcpygate
  PYTHON_VERSION: "3.12"

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python files
        run: python -m compileall -q app tests

      - name: Run unit tests
        env:
          SESSION_COOKIE_SECURE: "false"
          ENABLE_API_DOCS: "false"
        run: python -m unittest discover -s tests

      - name: Scan for forbidden resolution commands
        run: python -m unittest tests.test_resolution_safety

      - name: Scan for credential-shaped values
        run: |
          pattern='-----BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----|AKIA[0-9A-Z]{16}|ASIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9_]{30,}|github_pat_[A-Za-z0-9_]{40,}|sk-[A-Za-z0-9_-]{32,}|sk_live_[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{35}|(ALAS_TOKEN|ALAS_GYRE_TOKEN|ALAS_GYRE_API_TOKEN|SESSION_SECRET|INITIAL_ADMIN_PASSWORD)[[:space:]]*=[[:space:]]*[^$<{[:space:]]+'
          set +e
          matches="$(grep -RIlE \
            --exclude-dir=.git \
            --exclude-dir=__pycache__ \
            --exclude-dir=.pytest_cache \
            --exclude-dir=.mypy_cache \
            --exclude-dir=.ruff_cache \
            -- "$pattern" .)"
          status=$?
          set -e
          if [ "$status" -gt 1 ]; then
            echo "Credential scan failed to execute."
            exit "$status"
          fi
          if [ -n "$matches" ]; then
            printf '%s\n' "$matches"
            echo "Credential-shaped value found; matched contents are intentionally hidden."
            exit 1
          fi

  docker:
    name: Docker Image
    runs-on: ubuntu-24.04
    needs: tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare image metadata
        run: |
          OWNER_LOWER="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          IMAGE_REPO="ghcr.io/${OWNER_LOWER}/${{ env.IMAGE_NAME }}"
          SHORT_SHA="$(git rev-parse --short HEAD)"

          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${{ github.ref_name }}"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            VERSION="pr-${{ github.event.pull_request.number }}-${SHORT_SHA}"
          else
            BRANCH="$(echo "${{ github.ref_name }}" | tr '/_' '--' | tr -cd '[:alnum:].-')"
            VERSION="${BRANCH}-${SHORT_SHA}"
          fi

          {
            echo "IMAGE_REPO=${IMAGE_REPO}"
            echo "VERSION=${VERSION}"
            echo "TAGS<<EOF"
            echo "${IMAGE_REPO}:${VERSION}"
            if [ "${{ github.ref_type }}" = "tag" ] && echo "${{ github.ref_name }}" | grep -Eq '^v'; then
              echo "${IMAGE_REPO}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.TAGS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build summary
        if: always()
        run: |
          echo "## ScrcpyGate Build" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Status: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: ${{ env.IMAGE_REPO }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: ${{ env.VERSION }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Event: ${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "- Push: skipped for pull request" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Push: GHCR" >> "$GITHUB_STEP_SUMMARY"
          fi
