# Used by GitHub's Generate release notes action, not an image-publishing workflow.
# Apply one primary category label before merging. First matching category wins.
changelog:
  categories:
    - title: Features and improvements
      labels:
        - enhancement
    - title: Fixes
      labels:
        - bug
    - title: Documentation
      labels:
        - documentation
    - title: Dependencies
      labels:
        - dependencies
    - title: Other changes
      labels:
        - "*"
