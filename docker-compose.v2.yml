services:
  web-scrcpy-v2:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-alpine}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
    image: web-scrcpy-v2:local
    container_name: web-scrcpy-v2
    restart: unless-stopped
    ports:
      - "${WEB_SCRCPY_BIND:-127.0.0.1}:${WEB_SCRCPY_PORT:-5000}:5000"
    environment:
      WEB_SCRCPY_DATA_DIR: /app/data
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://127.0.0.1:5000}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-127.0.0.1,localhost}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      ALLOW_NULL_ORIGIN: ${ALLOW_NULL_ORIGIN:-false}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-127.0.0.1,::1}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      ENABLE_API_DOCS: ${ENABLE_API_DOCS:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MIN_PASSWORD_LENGTH: ${MIN_PASSWORD_LENGTH:-12}
      PASSWORD_PBKDF2_ITERATIONS: ${PASSWORD_PBKDF2_ITERATIONS:-310000}
      LOGIN_RATE_LIMIT_ENABLED: ${LOGIN_RATE_LIMIT_ENABLED:-true}
      LOGIN_RATE_LIMIT_MAX: ${LOGIN_RATE_LIMIT_MAX:-6}
      LOGIN_RATE_LIMIT_WINDOW_SECONDS: ${LOGIN_RATE_LIMIT_WINDOW_SECONDS:-300}
      LOGIN_LOCKOUT_SECONDS: ${LOGIN_LOCKOUT_SECONDS:-600}
      VIDEO_QUEUE_MAXSIZE: ${VIDEO_QUEUE_MAXSIZE:-60}
      VIDEO_QUEUE_SOFT_LIMIT: ${VIDEO_QUEUE_SOFT_LIMIT:-45}
      ADB_AUTOCONNECT: ${ADB_AUTOCONNECT:-true}
      ADB_HEARTBEAT_INTERVAL: ${ADB_HEARTBEAT_INTERVAL:-15}
      ADB_CONNECT_TIMEOUT: ${ADB_CONNECT_TIMEOUT:-8}
      ADB_RECONNECT_BACKOFF: ${ADB_RECONNECT_BACKOFF:-5}
      SCRCPY_STREAM_MODE: ${SCRCPY_STREAM_MODE:-raw}
      SCRCPY_STREAM_HEALTH_TIMEOUT: ${SCRCPY_STREAM_HEALTH_TIMEOUT:-5}
    volumes:
      - ${WEB_SCRCPY_DATA_HOST:-./data}:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Network ADB only does not need privileged mode. USB ADB requires extra device mapping and permissions.
