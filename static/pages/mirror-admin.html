<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>投屏管理 - ScrcpyGate</title>
    <script>
      (function(){try{var saved=localStorage.getItem('scrcpygate-theme');var dark=(saved==='dark')||(!saved&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.classList.toggle('dark',dark);}catch(e){}})();
    </script>

    <link rel="stylesheet" href="/static/css/tailwind.generated.css">
    <script src="/static/vendor/lucide.min.js"></script>
    <link rel="stylesheet" href="/static/shared/responsive.css">
    <script src="/static/shared/i18n.js"></script>
    <script src="/static/shared/api.js"></script>
    <script src="/static/shared/session.js"></script>
    <script src="/static/shared/responsive.js"></script>



</head>
<body class="h-screen overflow-hidden font-sans antialiased">


  <main class="admin-shell" data-viewport-mode="app-shell" data-admin-page aria-label="ScrcpyGate 管理控制台">
    <aside class="admin-rail" id="admin-sidebar" aria-label="主导航">
      <button class="collapse-btn" id="adminSidebarToggle" type="button" aria-label="收起侧边栏" title="收起侧边栏" aria-expanded="true"><i data-lucide="panel-left-close"></i></button>

      <div class="sidebar-divider"></div>
      <div class="sidebar-group-label">工作台</div>
      <nav class="sidebar-nav" aria-label="工作区导航">
        <a class="side-item" href="/admin" data-dom-id="admin-dashboard-link" title="仪表盘"><i data-lucide="layout-dashboard"></i><span class="menu-text"><b>仪表盘</b><small>概览统计</small></span></a>
      </nav>
      <div class="sidebar-divider"></div>
      <div class="sidebar-group-label">资源管理</div>
      <nav class="sidebar-nav" aria-label="资源导航">
        <a class="side-item" href="/devices" data-dom-id="admin-devices-link" title="设备管理"><i data-lucide="smartphone"></i><span class="menu-text"><b>设备管理</b><small>投屏与状态</small></span></a>
        <a class="side-item" href="/users" data-dom-id="admin-users-link" title="用户与权限"><i data-lucide="users"></i><span class="menu-text"><b>用户与权限</b><small>角色与到期</small></span><span class="side-badge" id="nav-expiring-badge" hidden></span></a>
        <a class="side-item active" href="/mirror-admin" data-dom-id="admin-mirror-admin-link" title="投屏管理" aria-current="page"><i data-lucide="monitor-cog"></i><span class="menu-text"><b>投屏管理</b><small>菜单与控件</small></span></a>
        <a class="side-item" href="/alas" data-dom-id="admin-alas-link" title="ALAS 管理"><i data-lucide="bot"></i><span class="menu-text"><b>ALAS 管理</b><small>配置与绑定</small></span></a>
      </nav>
      <div class="sidebar-divider"></div>
      <div class="sidebar-group-label">系统</div>
      <nav class="sidebar-nav" aria-label="系统导航">
        <a class="side-item" href="/quality" data-dom-id="admin-quality-link" title="画质与传输"><i data-lucide="sliders-horizontal"></i><span class="menu-text"><b>画质与传输</b><small>分辨率与码率</small></span></a>
        <a class="side-item" href="/security" data-dom-id="admin-security-link" title="安全机制"><i data-lucide="shield-check"></i><span class="menu-text"><b>安全机制</b><small>登录防护</small></span></a>
        <a class="side-item" href="/logs" data-dom-id="admin-logs-link" title="日志审计"><i data-lucide="scroll-text"></i><span class="menu-text"><b>日志审计</b><small>记录与追踪</small></span></a>
      </nav>
      <div class="rail-bottom">
        <div class="sidebar-divider"></div>
        <a id="back-to-mirror" data-dom-id="back-to-mirror" class="side-item" href="/mirror" title="返回投屏工作台"><i data-lucide="monitor-up"></i><span class="menu-text"><b>返回投屏工作台</b><small>前往画面与控制</small></span></a>
        <div class="side-version">ScrcpyGate</div>
        <a data-dom-id="mirror-link" href="/mirror" hidden aria-hidden="true" tabindex="-1"></a>
      </div>
      <div class="admin-rail-scrollbar" id="admin-rail-scrollbar" aria-hidden="true"></div>
    </aside>
    <div class="mobile-scrim" id="mobile-scrim" aria-hidden="true"></div>

    <header class="admin-topbar">
      <button class="mobile-menu-btn" id="mobile-menu-btn" type="button" aria-label="打开菜单" title="菜单"><i data-lucide="menu"></i></button>
      <nav class="breadcrumb" aria-label="面包屑">
        <a href="/">首页</a><i data-lucide="chevron-right"></i><a href="/admin">管理后台</a><i data-lucide="chevron-right"></i><b>投屏管理</b>
      </nav>
      <div class="topbar-actions">
      <button class="theme-toggle" id="adminThemeToggle" type="button" aria-label="切换到浅色模式" aria-pressed="true" title="切换到浅色模式"><i data-lucide="sun-moon"></i></button>
      <div class="account-menu" id="account-menu">
        <button class="menu-trigger" type="button" aria-haspopup="true" aria-expanded="false" aria-label="账户菜单">
          <span class="admin-avatar" aria-hidden="true">A</span>
          <span class="user-copy"><b data-session-display-name>当前账户</b><span data-session-username>正在加载账户信息</span></span>
          <span class="chev"><i data-lucide="chevron-down"></i></span>
        </button>
        <div class="menu-panel" role="menu">
          <div class="menu-head">
            <span class="admin-avatar" aria-hidden="true">A</span>
            <div><b data-session-display-name>当前账户</b><span data-session-username>正在加载账户信息</span></div>
          </div>
          <div class="menu-sep" role="separator"></div>
          <button class="menu-item danger" type="button" role="menuitem"><i data-lucide="log-out"></i><span>退出登录</span></button>
        </div>
      </div>
      </div>
    </header>

    <section class="admin-stage">
      <div class="admin-scroll overflow-y-auto" data-scroll-region="primary">
        <div class="admin-content workspace-refined page-mirror-admin">

          <div class="page-heading wb-head">
            <div class="page-heading-copy">
              <h1>投屏管理</h1>
              <p>按角色设置状态条、控制按钮与全屏显示</p>
            </div>
          </div>

          <div class="wb-toolbar">
            <p class="wb-hint">访问权限请在「用户与权限」中管理。<span class="sg-help"><button class="sg-help-trigger" type="button" aria-label="投屏管理说明" aria-describedby="workbench-help" aria-expanded="false"><i data-lucide="info" aria-hidden="true"></i></button><span class="sg-help-pop" id="workbench-help" role="tooltip">先选择角色，再调整对应工作台的状态条、控制按钮与全屏显示。</span></span></p>
            <div class="wb-roletabs" id="workbench-roletabs"></div>
          </div>

          <div class="wb-layout" id="workbench-layout" role="tabpanel" aria-busy="true">
            <p class="wb-placeholder" id="workbench-placeholder">正在加载开关…</p>
          </div>

          <!-- 保存动作放到底部（Apple Copy：动作在内容之后）。这两个按钮是静态 DOM：
               mirror-admin-page.js 在初始化时按 id 绑定监听，不能被 render() 重建掉。 -->
          <div class="wb-foot" role="group" aria-label="保存投屏管理设置">
            <span class="wb-status" id="workbench-status" role="status" aria-live="polite">未修改</span>
            <span class="wb-foot-spacer" aria-hidden="true"></span>
            <button class="wb-btn ghost" type="button" id="workbench-reset">恢复默认</button>
            <button class="wb-btn primary" type="button" id="workbench-save" disabled>保存</button>
          </div>

        </div>
      </div>
    </section>

  </main>

</body></html>
