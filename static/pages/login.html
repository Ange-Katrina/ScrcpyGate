<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>登录 - ScrcpyGate</title>
    <script>
      (function(){try{var saved=localStorage.getItem('scrcpygate-theme');var dark=(saved==='dark')||(!saved&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.classList.toggle('dark',dark);}catch(e){}})();
    </script>

    <link rel="stylesheet" href="/static/css/tailwind.generated.css">
    <script src="/static/vendor/lucide.min.js"></script>
    <link rel="stylesheet" href="/static/shared/responsive.css">
    <script src="/static/shared/i18n.js"></script>
    <script src="/static/shared/api.js"></script>
    <script src="/static/shared/responsive.js"></script>



</head>
<body class="flex min-h-screen items-center justify-center font-sans antialiased" style="background: var(--carbon-ambient); background-color: var(--carbon-mid);">
    <style id="critical-layout">
        body { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        main { width: 100%; }
    </style>
    <main class="w-full px-6 py-16">


        <!-- 顶部工具栏：语言 / 主题切换（毛玻璃悬浮胶囊） -->
        <div data-i18n-skip class="fixed right-4 top-4 z-50 flex items-center gap-1 rounded-full border border-border/80 p-1 shadow-[var(--shadow-md)]" style="background: var(--glass-panel-solid); backdrop-filter: blur(16px) saturate(1.15); -webkit-backdrop-filter: blur(16px) saturate(1.15); box-shadow: 0 12px 32px var(--deep-shadow), inset 0 1px 0 var(--inner-highlight); transition: background-color var(--motion-base) var(--ease-fade), border-color var(--motion-base) var(--ease-fade), box-shadow var(--motion-base) var(--ease-fade)">
            <label class="inline-flex h-9 cursor-pointer items-center gap-1.5 rounded-full px-2.5 text-sm text-foreground hover:bg-accent focus-within:bg-accent" style="transition: background-color var(--motion-base) var(--ease-fade), color var(--motion-base) var(--ease-fade), opacity var(--motion-base) var(--ease-fade)">
                <span class="sr-only">界面语言</span>
                <i data-lucide="languages" class="h-4 w-4 shrink-0 text-muted-foreground"></i>
                <select id="lang-select" data-lang-switch class="toolbar-select cursor-pointer" aria-label="界面语言">
                    <option value="zh-CN" selected>简体中文</option>
                    <option value="en">English</option>
                </select>
            </label>
            <label class="inline-flex h-9 cursor-pointer items-center gap-1.5 rounded-full px-2.5 text-sm text-foreground hover:bg-accent focus-within:bg-accent" style="transition: background-color var(--motion-base) var(--ease-fade), color var(--motion-base) var(--ease-fade), opacity var(--motion-base) var(--ease-fade)">
                <span class="sr-only">主题</span>
                <i data-lucide="sun-moon" class="h-4 w-4 shrink-0 text-muted-foreground"></i>
                <select id="theme-select" class="toolbar-select cursor-pointer" aria-label="主题">
                    <option value="system" selected>跟随系统</option>
                    <option value="light">浅色</option>
                    <option value="dark">深色</option>
                </select>
            </label>
        </div>

        <!-- 登录面板（毛玻璃） -->
        <section aria-labelledby="login-title" class="mx-auto w-full max-w-[400px] rounded-[var(--radius)] border border-[var(--c-border)] p-10 shadow-[var(--shadow-xl)]" style="background: var(--glass-panel); backdrop-filter: blur(22px) saturate(1.15); -webkit-backdrop-filter: blur(22px) saturate(1.15); box-shadow: 0 32px 80px var(--deep-shadow-strong), 0 12px 32px var(--deep-shadow), inset 0 1px 0 var(--inner-highlight-strong);">
            <div class="mx-auto mb-4 flex h-12 w-12 items-center justify-center rounded-2xl" style="background: var(--brand-blue); box-shadow: 0 6px 16px var(--brand-glow-soft);"><i data-lucide="monitor" class="h-6 w-6 text-white" style="stroke-width:1.7"></i></div>
            <h1 id="login-title" class="text-center text-4xl font-semibold tracking-normal text-foreground">ScrcpyGate</h1>
            <p class="mt-2 text-center text-sm text-muted-foreground">远程投屏控制台</p>

            <form id="login-form" data-dom-id="login-form" class="mt-8 space-y-4">
                <div class="flex h-11 items-center gap-2 rounded-[var(--radius)] border border-[var(--c-border)] px-3 shadow-[var(--shadow-xs)] focus-within:border-ring focus-within:shadow-[0_0_0_1px_var(--apple-ring)]" style="background: var(--glass-field); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); transition: border-color var(--motion-base) var(--ease-fade), box-shadow var(--motion-base) var(--ease-fade)">
                    <label for="username" class="sr-only">用户名</label>
                    <i data-lucide="user" class="h-4 w-4 shrink-0 text-muted-foreground"></i>
                    <input id="username" name="username" type="text" autocomplete="username" placeholder="请输入用户名" aria-label="用户名" class="h-full min-w-0 flex-1 border-0 bg-transparent text-[15px] text-foreground outline-none placeholder:text-muted-foreground" />
                </div>

                <div class="flex h-11 items-center gap-2 rounded-[var(--radius)] border border-[var(--c-border)] px-3 shadow-[var(--shadow-xs)] focus-within:border-ring focus-within:shadow-[0_0_0_1px_var(--apple-ring)]" style="background: var(--glass-field); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); transition: border-color var(--motion-base) var(--ease-fade), box-shadow var(--motion-base) var(--ease-fade)">
                    <label for="password" class="sr-only">密码</label>
                    <input id="password" name="password" type="password" autocomplete="current-password" placeholder="请输入密码" aria-label="密码" class="h-full min-w-0 flex-1 border-0 bg-transparent text-[15px] text-foreground outline-none placeholder:text-muted-foreground" />
                    <button type="button" id="pwd-toggle" aria-label="显示密码" aria-pressed="false" class="inline-flex h-8 w-8 shrink-0 items-center justify-center rounded-full text-muted-foreground hover:text-foreground active:text-foreground focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ring" style="transition: color var(--motion-base) var(--ease-fade)">
                        <i data-lucide="eye" class="h-4 w-4"></i>
                        <i data-lucide="eye-off" class="hidden h-4 w-4"></i>
                    </button>
                </div>

                <p id="login-error" role="alert" style="display:none" class="text-sm text-destructive">用户名或密码错误</p>

                <!-- 登录保护：失败后的人机验证（滑块 + 工作量证明） -->
                <div id="login-lock-banner" class="login-lock-banner" hidden>
                    <span><b>登录已暂时封禁</b> —— 达到失败次数上限后，5 分钟内不接受任何登录提交</span>
                    <span class="login-lock-countdown" id="login-lock-countdown" aria-live="polite">–:––</span>
                </div>
                <div id="login-captcha" class="login-captcha" hidden>
                    <div class="login-captcha-head">
                        <span id="login-captcha-title">人机验证</span>
                        <span class="login-captcha-state" id="login-captcha-state">等待拖动滑块</span>
                    </div>
                    <div id="login-slider" class="login-slider" role="slider" aria-label="拖动滑块完成验证" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
                        <div class="login-slider-fill" id="login-slider-fill"></div>
                        <span class="login-slider-label" id="login-slider-label">按住滑块，拖动到最右侧</span>
                        <div class="login-slider-knob" id="login-slider-knob" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
                        </div>
                    </div>
                    <div class="login-pow-progress" id="login-pow-progress"><i></i></div>
                    <div class="login-pow-meta" id="login-pow-meta">难度 – ｜ 已计算 – ｜ 耗时 –</div>
                </div>

                <button id="login-submit" type="submit" class="inline-flex h-14 w-full items-center justify-center gap-2 whitespace-nowrap rounded-xl bg-primary text-base font-semibold text-primary-foreground shadow-[var(--shadow-sm)] hover:brightness-[0.96] active:brightness-90 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ring disabled:cursor-not-allowed disabled:opacity-40" style="transition: background-color var(--motion-base) var(--ease-fade), color var(--motion-base) var(--ease-fade), opacity var(--motion-base) var(--ease-fade), filter var(--motion-base) var(--ease-fade)">登录</button>
            </form>

            <div class="mt-8 flex flex-col items-center gap-2">
                <p class="text-xs text-muted-foreground">© ScrcpyGate</p>
            </div>
        </section>


    </main>

</body>
</html>
