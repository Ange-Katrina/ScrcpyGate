<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ScrcpyGate</title>
  <script src="/static/js/jmuxer.min.js"></script>
  <script src="/static/js/input.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --bg:#0c0f14; --surface:#171b24; --panel:#202635; --panel-soft:#252b3a;
      --line:#394254; --text:#f3f6fb; --muted:#9aa6ba; --primary:#2f7df6;
      --teal:#23b7a8; --ok:#28c982; --warn:#f0b84b; --danger:#ff6b6b; --dock:68px;
    }
    * { box-sizing:border-box; }
    html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; overflow:hidden; }
    button, input, select, textarea { font:inherit; }
    button { cursor:pointer; }
    .app { height:100vh; height:100dvh; display:grid; grid-template-columns:340px minmax(0,1fr); }
    .sidebar { min-height:0; overflow:auto; border-right:1px solid var(--line); background:#121720; padding:18px; }
    .brand-row { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:18px; }
    .brand { font-size:20px; font-weight:800; line-height:1.2; }
    .muted { color:var(--muted); }
    .link-btn, .logout { color:#86b4ff; background:transparent; border:0; text-decoration:none; padding:0; }
    .section-head { display:flex; align-items:center; justify-content:space-between; gap:10px; margin:18px 0 10px; }
    .section-title { color:#86b4ff; font-weight:750; }
    .sidebar-menu { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:10px; margin:16px 0 6px; }
    .device-list { display:grid; gap:10px; }
    .device-card { width:100%; text-align:left; border:1px solid var(--line); background:var(--surface); color:var(--text); border-radius:8px; padding:12px; display:grid; gap:8px; }
    .device-card.active { border-color:var(--primary); box-shadow:0 0 0 1px var(--primary) inset; }
    .device-card[disabled] { opacity:.55; cursor:not-allowed; }
    .device-title { display:flex; align-items:center; justify-content:space-between; gap:8px; }
    .device-title strong { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .device-meta { color:var(--muted); font-size:13px; }
    .side-actions { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:16px; }
    .side-actions .wide { grid-column:1 / -1; }
    .btn { border:1px solid var(--line); background:var(--panel); color:var(--text); border-radius:8px; min-height:42px; padding:0 14px; font-weight:700; }
    .btn:disabled { opacity:.55; cursor:not-allowed; }
    .btn.primary { border-color:transparent; background:var(--primary); color:white; }
    .btn.danger { border-color:rgba(255,107,107,.55); background:rgba(255,107,107,.1); color:#ffd7d7; }
    .btn.ghost { background:transparent; }
    .chips { display:flex; flex-wrap:wrap; gap:8px; }
    .chip { display:inline-flex; align-items:center; min-height:28px; padding:4px 9px; border:1px solid var(--line); border-radius:999px; color:var(--muted); font-size:13px; max-width:100%; }
    .chip.ok { color:#ccffe8; border-color:rgba(40,201,130,.45); background:rgba(40,201,130,.1); }
    .chip.warn { color:#ffe8ad; border-color:rgba(240,184,75,.45); background:rgba(240,184,75,.1); }
    .chip.danger { color:#ffd7d7; border-color:rgba(255,107,107,.45); background:rgba(255,107,107,.1); }
    .viewer { min-width:0; min-height:0; display:grid; grid-template-rows:auto minmax(0,1fr); background:#07090d; position:relative; }
    .viewer-top { min-width:0; display:flex; align-items:center; justify-content:space-between; gap:14px; padding:14px 16px; border-bottom:1px solid var(--line); background:#111722; }
    .selected-title { font-size:18px; font-weight:800; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .selected-meta { margin-top:3px; color:var(--muted); font-size:13px; }
    .top-left { min-width:0; display:flex; align-items:center; gap:10px; }
    .top-copy { min-width:0; }
    .top-menu-btn { display:none; min-height:34px; padding:0 10px; }
    .top-status { display:flex; flex-wrap:wrap; justify-content:flex-end; gap:8px; }
    .stage { position:relative; min-width:0; min-height:0; overflow:hidden; padding:12px 12px calc(var(--dock) + 12px + env(safe-area-inset-bottom)); display:grid; place-items:center; }
    .video-wrap { display:grid; place-items:center; overflow:hidden; background:#05070a; border:1px solid #151b25; width:100%; height:100%; }
    video { width:100%; height:100%; object-fit:contain; outline:none; background:#05070a; touch-action:none; }
    .empty { position:absolute; inset:12px 12px calc(var(--dock) + 12px + env(safe-area-inset-bottom)); display:grid; place-items:center; color:var(--muted); text-align:center; line-height:1.7; pointer-events:none; }
    .notice { position:absolute; top:72px; left:50%; transform:translateX(-50%); z-index:8; max-width:min(760px, calc(100vw - 28px)); padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:rgba(32,38,53,.96); color:var(--text); display:none; box-shadow:0 18px 50px rgba(0,0,0,.38); }
    .notice.show { display:block; }
    .tools { display:none; margin-top:12px; padding:12px; border:1px solid var(--line); border-radius:8px; background:rgba(23,27,36,.98); box-shadow:0 18px 50px rgba(0,0,0,.24); }
    .tools.open { display:block; }
    .tools-title { font-size:15px; font-weight:800; margin-bottom:12px; color:#dce7ff; }
    .setting-group { display:grid; gap:8px; padding:10px; border:1px solid rgba(57,66,84,.72); border-radius:8px; background:rgba(12,15,20,.28); }
    .setting-group + .setting-group { margin-top:10px; }
    .setting-group-title { display:flex; align-items:baseline; justify-content:space-between; gap:8px; color:#dce7ff; font-size:13px; font-weight:800; }
    .setting-group-help { color:var(--muted); font-size:12px; font-weight:500; line-height:1.45; }
    .tool-row { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:8px; }
    .tool-row.two { grid-template-columns:repeat(2, minmax(0,1fr)); }
    .tool-row .btn { min-height:36px; padding:0 10px; font-weight:650; }
    .tool-row .btn.active, .quality-grid .btn.active { border-color:var(--teal); color:#d9fffb; background:rgba(35,183,168,.14); }
    .quality-grid { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:10px; }
    .quality-grid label { display:grid; gap:5px; color:var(--muted); font-size:12px; }
    .quality-grid input, .quality-grid select { width:100%; min-height:38px; border:1px solid var(--line); background:var(--panel); color:var(--text); border-radius:7px; padding:7px 9px; outline:none; }
    .quality-grid .wide { grid-column:1 / -1; }
    .quality-note { margin:8px 0 0; color:var(--muted); font-size:12px; line-height:1.55; }
    .quality-status { margin-top:8px; min-height:18px; color:#d9fffb; font-size:12px; line-height:1.5; }
    .quality-status:empty { display:none; }
    .alas-panel .actions { display:flex; flex-wrap:wrap; gap:8px; }
    .alas-panel .actions .btn { min-height:36px; }
    .account-grid { display:grid; gap:10px; }
    .account-grid label { display:grid; gap:6px; color:var(--muted); font-size:12px; }
    .account-grid input { width:100%; min-height:38px; border:1px solid var(--line); background:var(--panel); color:var(--text); border-radius:7px; padding:7px 9px; outline:none; }
    .account-grid input:focus { border-color:var(--primary); }
    .dock { position:absolute; left:50%; bottom:10px; z-index:4; transform:translateX(-50%); min-height:52px; padding:6px 10px calc(6px + env(safe-area-inset-bottom)); display:flex; justify-content:center; align-items:center; gap:8px; background:rgba(17,23,34,.84); border:1px solid rgba(57,66,84,.72); border-radius:999px; box-shadow:0 18px 44px rgba(0,0,0,.34); backdrop-filter:blur(14px); }
    .nav-btn { width:58px; height:42px; border:0; border-radius:14px; background:transparent; color:var(--muted); display:grid; grid-template-rows:18px 14px; place-items:center; gap:2px; padding:4px 0; font-weight:750; }
    .nav-btn:hover, .nav-btn:focus-visible { color:var(--text); background:rgba(255,255,255,.08); outline:none; }
    .nav-icon { display:block; color:currentColor; }
    .nav-back { width:0; height:0; border-top:7px solid transparent; border-bottom:7px solid transparent; border-right:11px solid currentColor; }
    .nav-home { width:15px; height:15px; border:2px solid currentColor; border-radius:50%; }
    .nav-recent { width:15px; height:15px; border:2px solid currentColor; border-radius:4px; }
    .nav-label { font-size:11px; line-height:1; }
    .sidebar-backdrop { display:none; }
    @media (max-width: 900px) {
      :root { --dock:64px; }
      .app { grid-template-columns:1fr; }
      .sidebar { position:absolute; z-index:10; left:10px; top:10px; width:min(380px, calc(100vw - 20px)); max-height:calc(100vh - var(--dock) - 26px); border:1px solid var(--line); border-radius:8px; transform:translateY(calc(-100% - 24px)); transition:transform .18s ease; box-shadow:0 24px 60px rgba(0,0,0,.48); }
      .sidebar.open { transform:translateY(0); }
      .sidebar-backdrop.open { display:block; position:absolute; inset:0; z-index:9; background:rgba(0,0,0,.34); }
      .viewer-top { display:block; padding:10px 12px; }
      .top-left { align-items:flex-start; }
      .top-menu-btn { display:inline-flex; align-items:center; }
      .top-status { justify-content:flex-start; margin-top:8px; }
      .stage { padding:6px 6px calc(var(--dock) + 8px + env(safe-area-inset-bottom)); }
      .empty { inset:6px 6px calc(var(--dock) + 8px + env(safe-area-inset-bottom)); }
      .dock { bottom:8px; max-width:calc(100vw - 18px); overflow:hidden; padding-left:8px; padding-right:8px; }
      .nav-btn { width:54px; height:40px; }
      .quality-grid { grid-template-columns:1fr; }
      .quality-grid .wide { grid-column:1; }
    }
  </style>
</head>
<body>
<div class="app">
  <aside id="sidebar" class="sidebar">
    <div class="brand-row">
      <div>
        <div class="brand">ScrcpyGate</div>
        <div class="chips" style="margin-top:10px"><span class="chip">{{ user.username }}</span><span id="roleChip" class="chip"></span></div>
      </div>
      <form method="post" action="/logout"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button class="logout" type="submit">退出</button></form>
    </div>
    <a id="adminLink" class="link-btn" href="/admin" hidden>后台管理</a>
    <div class="sidebar-menu">
      <button id="toolBtn" class="btn" type="button">画面设置</button>
      <button id="alasBtn" class="btn" type="button">ALAS</button>
      <button id="accountBtn" class="btn" type="button">账户</button>
    </div>
    <div class="section-head"><div class="section-title">设备</div><button id="refreshBtn" class="link-btn" type="button">刷新</button></div>
    <div id="devices" class="device-list"></div>
    <div class="side-actions">
      <button id="startBtn" class="btn primary wide" type="button">开始投屏</button>
      <button id="controlBtn" class="btn" type="button">获取控制</button>
      <button id="stopBtn" class="btn danger" type="button">停止投屏</button>
    </div>
    <div id="tools" class="tools">
      <div class="tools-title">画面设置</div>
      <div class="setting-group">
        <div class="setting-group-title">
          <span>画面大小</span>
          <span class="setting-group-help">只影响网页显示</span>
        </div>
        <div class="tool-row">
          <button class="btn" data-fit="contain" type="button">适应窗口</button>
          <button class="btn" data-fit="original" type="button">原始大小</button>
        </div>
      </div>
      <div class="setting-group">
        <div class="setting-group-title">
          <span>投屏画质</span>
          <span class="setting-group-help">应用后会重启投屏流</span>
        </div>
        <div class="quality-grid" id="qualityProfiles">
          <button class="btn" data-profile="smooth" type="button">流畅</button>
          <button class="btn" data-profile="balanced" type="button">稳定</button>
          <button class="btn" data-profile="sharp" type="button">高清</button>
          <button class="btn" data-profile="low_latency" type="button">低延迟</button>
          <label class="wide">scrcpy 流模式
            <select id="qualityStreamMode">
              <option value="raw">raw</option>
              <option value="protocol">protocol</option>
              <option value="legacy">legacy 诊断</option>
            </select>
          </label>
        </div>
        <div id="qualityStatus" class="quality-status"></div>
      </div>
      <p class="quality-note">投屏中点击预设会自动重启投屏流；只调整 scrcpy 输出流，不修改设备真实分辨率。</p>
    </div>
    <div id="alasTools" class="tools alas-panel">
      <div class="tools-title">ALAS</div>
      <div id="alasPanelStatus" class="chips"></div>
      <div class="actions" style="margin-top:12px">
        <button id="alasToggleRun" class="btn warn" type="button">启动 ALAS</button>
        <button id="alasReload" class="btn" type="button">刷新</button>
        <a class="btn" href="/alas/embed/" target="_blank" rel="noopener noreferrer">打开 ALAS 页面</a>
      </div>
      <p class="quality-note">配置名由后台绑定决定；这里只提供启动、停止和重启，不显示或编辑配置内容。</p>
    </div>
    <div id="accountTools" class="tools">
      <div class="tools-title">账户设置</div>
      <div id="accountInfo" class="chips"></div>
      <div class="setting-group">
        <div class="setting-group-title">
          <span>修改密码</span>
          <span class="setting-group-help">至少 12 位</span>
        </div>
        <div class="account-grid">
          <label>当前密码
            <input id="currentPassword" type="password" autocomplete="current-password">
          </label>
          <label>新密码
            <input id="newPassword" type="password" autocomplete="new-password">
          </label>
          <label>确认新密码
            <input id="confirmPassword" type="password" autocomplete="new-password">
          </label>
          <button id="changePasswordBtn" class="btn primary" type="button">保存新密码</button>
        </div>
      </div>
      <p class="quality-note">修改成功后会保留当前登录，并让同账号其它浏览器会话失效。</p>
    </div>
  </aside>
  <div id="sidebarBackdrop" class="sidebar-backdrop"></div>
  <main class="viewer">
    <div class="viewer-top">
      <div class="top-left">
        <button id="menuBtn" class="btn top-menu-btn" type="button">菜单</button>
        <div class="top-copy">
          <div id="selectedTitle" class="selected-title">未选择设备</div>
          <div id="selectedMeta" class="selected-meta">从设备列表选择一个设备后开始投屏</div>
        </div>
      </div>
      <div id="topStatus" class="top-status"></div>
    </div>
    <div id="notice" class="notice"></div>
    <div id="stage" class="stage">
      <div id="videoWrap" class="video-wrap"><video id="phoneVideo" muted autoplay playsinline tabindex="0"></video></div>
      <div id="empty" class="empty">选择设备后开始投屏</div>
      <nav class="dock" aria-label="安卓导航">
        <button id="backBtn" class="nav-btn" type="button" title="返回" aria-label="返回">
          <span class="nav-icon nav-back" aria-hidden="true"></span><span class="nav-label">返回</span>
        </button>
        <button id="homeBtn" class="nav-btn" type="button" title="主页" aria-label="主页">
          <span class="nav-icon nav-home" aria-hidden="true"></span><span class="nav-label">主页</span>
        </button>
        <button id="recentBtn" class="nav-btn" type="button" title="菜单" aria-label="菜单">
          <span class="nav-icon nav-recent" aria-hidden="true"></span><span class="nav-label">菜单</span>
        </button>
      </nav>
    </div>
  </main>
</div>
<script>
const csrfToken = "{{ csrf_token }}";
const SELECTED_KEY = 'webscrcpy:v2:selectedDeviceId';
const state = {
  user:null, devices:[], sessions:{}, selectedDeviceId:localStorage.getItem(SELECTED_KEY) || '', activeDeviceId:'',
  videoWs:null, controlWs:null, eventWs:null, jmuxer:null, input:null, hasControl:false, fit:'contain', screen:{w:1280,h:720}, alas:null,
  videoConnected:false, controlConnected:false, videoPrefs:null, eventRefreshTimer:null, playerResetTimer:null, lastPlayerResetAt:0, lastDelayTrimAt:0,
  idleStopTimer:null, idleStopReason:'', starting:false, lastStartAt:0, videoSeq:0, controlSeq:0, qualityProfile:'balanced', qualityApplying:false
};
const $ = (id) => document.getElementById(id);
function wsUrl(path){ return `${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}${path}`; }
function getDeviceId(device){ return String((device && (device.device_id || device.id)) || '').trim(); }
function currentDevice(){ return state.devices.find(d => getDeviceId(d) === state.selectedDeviceId) || null; }
function selectedSession(){ const id=state.selectedDeviceId; const device=currentDevice(); return id ? (state.sessions[id] || (device && device.session) || null) : null; }
function deviceLabel(device){ return device ? (device.display_name || device.name || '设备') : '未选择设备'; }
function show(message, ms=3200){ const n=$('notice'); n.textContent=message || '操作失败'; n.classList.add('show'); clearTimeout(show.t); show.t=setTimeout(()=>n.classList.remove('show'),ms); }
function chip(text, cls=''){ const s=document.createElement('span'); s.className=`chip ${cls}`.trim(); s.textContent=text; return s; }
async function fetchJson(url, options={}){
  const opts = Object.assign({headers:{}}, options);
  if (opts.body && typeof opts.body !== 'string') { opts.headers['content-type']='application/json'; opts.body = JSON.stringify(opts.body); }
  if (!['GET','HEAD'].includes((opts.method || 'GET').toUpperCase())) opts.headers['x-csrf-token'] = csrfToken;
  const res = await fetch(url, opts);
  const text = await res.text();
  let data = {}; try { data = text ? JSON.parse(text) : {}; } catch (_) { data = {detail:text}; }
  if (!res.ok) throw new Error(data.detail || `HTTP ${res.status}`);
  return data;
}
function normalizeSelection(){
  const ids = state.devices.map(getDeviceId).filter(Boolean);
  if (!ids.length) { state.selectedDeviceId=''; localStorage.removeItem(SELECTED_KEY); return; }
  if (!state.selectedDeviceId || !ids.includes(state.selectedDeviceId)) state.selectedDeviceId = ids[0];
  localStorage.setItem(SELECTED_KEY, state.selectedDeviceId);
}
function selectDevice(id){
  if (!id || id === state.selectedDeviceId) return;
  const oldActive = state.activeDeviceId;
  if (state.videoWs || state.controlWs) {
    closeVideo();
    if (oldActive && oldActive !== id) stopSwitchedMirror(oldActive).catch(()=>{});
  }
  state.selectedDeviceId=id;
  localStorage.setItem(SELECTED_KEY, id);
  closeSidebar();
  render();
}
async function stopSwitchedMirror(id){
  const session = state.sessions[id];
  if (!session || !session.running) return;
  await new Promise(resolve=>setTimeout(resolve, 250));
  const result = await fetchJson(`/api/devices/${encodeURIComponent(id)}/mirror/idle-stop`, {method:'POST', body:{reason:'switch_device'}});
  state.sessions = result.sessions || state.sessions;
  render();
}
function mergeSessions(devices, sessions){
  const merged = Object.assign({}, sessions || {});
  devices.forEach(d => { const id=getDeviceId(d); if (id && d.session) merged[id]=d.session; });
  return merged;
}
function socketLive(ws){
  return !!ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING);
}
const BUILTIN_PROFILE_LABELS = {smooth:'流畅', balanced:'稳定', sharp:'高清', low_latency:'低延迟'};
const ADB_STATE_LABELS = {online:'在线', offline:'离线', unauthorized:'未授权', reconnecting:'重连中', unknown:'未知'};
const STREAM_HEALTH_LABELS = {healthy:'正常', idle:'空闲', starting:'启动中', config:'等待配置', invalid_h264:'视频异常', adb_failed:'ADB 失败', failed:'失败', stopped:'已停止', unknown:'未知'};
const ALAS_STATUS_LABELS = {running:'运行中', stopped:'已停止', error:'异常', unknown:'未知'};
function labelFrom(map, value, fallback){
  const key = String(value || '').trim();
  return map[key] || fallback || key || '未知';
}
function adbStateLabel(value){ return labelFrom(ADB_STATE_LABELS, value, '未知'); }
function streamModeLabel(mode){ return ({raw:'原始流 raw', protocol:'协议流 protocol', legacy:'诊断 legacy'}[mode]) || mode; }
function streamModeShortLabel(mode){ return ({raw:'原始流', protocol:'协议流', legacy:'诊断流', none:'无'}[mode]) || mode || '未知'; }
function streamHealthLabel(value){ return labelFrom(STREAM_HEALTH_LABELS, value, '未知'); }
function alasStatusLabel(value){ return labelFrom(ALAS_STATUS_LABELS, value, '未知'); }
function qualitySummary(){
  const q = qualityPayload();
  const size = q.max_size > 0 ? q.max_size : '原始';
  const fps = q.max_fps > 0 ? q.max_fps : '不限';
  return `输出 ${size} / ${Math.round(q.video_bit_rate / 100000) / 10}Mbps / ${fps}fps / ${streamModeShortLabel(q.scrcpy_stream_mode || 'raw')}`;
}
function enabledStreamModes(){
  const modes = state.videoPrefs && state.videoPrefs.enabled_stream_modes;
  return Array.isArray(modes) && modes.length ? modes : ['raw'];
}
function renderQualityStreamMode(selected){
  const select = $('qualityStreamMode');
  if (!select) return;
  const modes = enabledStreamModes();
  select.textContent = '';
  modes.forEach(mode=>{
    const option=document.createElement('option');
    option.value=mode;
    option.textContent=streamModeLabel(mode);
    select.appendChild(option);
  });
  select.value = modes.includes(selected) ? selected : modes[0];
}
function qualityPayload(){
  const profile = state.qualityProfile || 'balanced';
  const presets = state.videoPrefs && state.videoPrefs.profiles;
  const preset = (presets && presets[profile]) || (presets && presets.balanced) || {video_bit_rate:900000, max_size:540, max_fps:24};
  const modes = enabledStreamModes();
  return {
    profile,
    adaptive:false,
    video_bit_rate:Number(preset.video_bit_rate || 900000),
    max_size:Number(preset.max_size == null ? 540 : preset.max_size),
    max_fps:Number(preset.max_fps == null ? 24 : preset.max_fps),

}
function sendKey(code){ if (!state.hasControl || !state.input) return show('请先获取控制'); if (state.input.sendKeyCodePress) state.input.sendKeyCodePress(code); }
async function reloadAlas(){ state.alas = await fetchJson('/api/alas/status'); render(); }
async function toggleAlas(){ const result = await fetchJson('/api/alas/toggle', {method:'POST'}); if(result.ok === false) return show(result.error || 'ALAS 操作失败'); state.alas = result.alas || result; render(); show(state.alas.status === 'running' ? 'ALAS 已启动' : 'ALAS 状态已更新'); }
function scheduleRefresh(){ clearTimeout(state.eventRefreshTimer); state.eventRefreshTimer=setTimeout(()=>loadAll().catch(()=>{}), 300); }
function openEvents(){
  state.eventWs = new WebSocket(wsUrl('/ws/events'));
  state.eventWs.onmessage = (event) => {
    const msg=JSON.parse(event.data);
    if (msg.sessions) state.sessions=msg.sessions;
    if (msg.type === 'mirror_status' || msg.type === 'control_lock') scheduleRefresh();
    render();
  };
  state.eventWs.onclose = () => setTimeout(openEvents, 2500);
}
function openSidebar(){ $('sidebar').classList.add('open'); $('sidebarBackdrop').classList.add('open'); }
function closeSidebar(){ $('sidebar').classList.remove('open'); $('sidebarBackdrop').classList.remove('open'); }
$('startBtn').onclick=()=>startMirror().catch(e=>show(e.message));
$('stopBtn').onclick=()=>stopMirror().catch(e=>show(e.message));
$('controlBtn').onclick=()=>toggleControl().catch(e=>show(e.message));
$('refreshBtn').onclick=()=>loadAll().catch(e=>show(e.message));
$('menuBtn').onclick=()=>openSidebar();
$('sidebarBackdrop').onclick=()=>closeSidebar();
$('toolBtn').onclick=()=>toggleToolPanel('tools');
$('backBtn').onclick=()=>sendKey(4);
$('homeBtn').onclick=()=>sendKey(3);
$('recentBtn').onclick=()=>sendKey(187);
$('alasBtn').onclick=()=>toggleToolPanel('alasTools');
$('accountBtn').onclick=()=>toggleToolPanel('accountTools');
$('changePasswordBtn').onclick=()=>changePassword().catch(e=>show(e.message));
$('alasToggleRun').onclick=()=>toggleAlas().catch(e=>show(e.message));
$('alasReload').onclick=()=>reloadAlas().catch(e=>show(e.message));
$('qualityStreamMode').onchange=()=>saveOrApplyQuality().catch(e=>show(e.message));
document.querySelectorAll('[data-fit]').forEach(btn=>btn.onclick=()=>{ state.fit=btn.dataset.fit; handleViewportResize(); render(); });
window.addEventListener('resize', handleViewportResize);
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', handleViewportResize);
  window.visualViewport.addEventListener('scroll', handleViewportResize);
}
if (window.ResizeObserver) {
  const stageResizeObserver = new ResizeObserver(handleViewportResize);
  stageResizeObserver.observe($('stage'));
}
window.addEventListener('blur', ()=>scheduleInactiveStop('window_blur'));
window.addEventListener('focus', ()=>cancelInactiveStop());
document.addEventListener('visibilitychange', ()=>{ if (document.hidden) scheduleInactiveStop('document_hidden'); else cancelInactiveStop(); });
loadAll().then(openEvents).catch(e=>show(e.message));
setInterval(()=>loadAll().catch(()=>{}), 15000);
</script>
</body>
</html>
