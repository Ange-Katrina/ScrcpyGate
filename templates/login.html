<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111315">
  <title>ScrcpyGate 登录</title>
  <script src="/static/js/theme-init.js?v=20260712"></script>
  <link rel="stylesheet" href="/static/css/ui-tokens.css?v=20260712">
  <link rel="stylesheet" href="/static/css/ui-components.css?v=20260712">
  <link rel="stylesheet" href="/static/css/login.css?v=20260712">
  <script src="/static/js/ui-core.js?v=20260712" defer></script>
</head>
<body data-ui-page="login">
  <label class="ui-theme-picker ui-theme-corner">
    <svg class="ui-icon" aria-hidden="true"><use href="/static/icons/lucide.svg?v=20260712#sun-moon"></use></svg>
    <span class="ui-sr-only">界面主题</span>
    <select data-ui-theme-select aria-label="界面主题">
      <option value="dark">深色</option>
      <option value="light">浅色</option>
      <option value="system">跟随系统</option>
    </select>
  </label>
  <main class="login-panel">
    <h1>ScrcpyGate</h1>
    <p class="login-intro">登录后选择设备投屏并获取控制权。</p>
    {% if error %}<div class="login-error" role="alert">{{ error }}</div>{% endif %}
    <form class="login-form" method="post" action="/login">
      <label class="ui-field" for="username">用户名
        <input class="ui-input" id="username" name="username" autocomplete="username" autofocus required>
      </label>
      <label class="ui-field" for="password">密码
        <input class="ui-input" id="password" name="password" type="password" autocomplete="current-password" required>
      </label>
      <button class="ui-button ui-button--primary login-submit" type="submit">登录</button>
    </form>
  </main>
</body>
</html>
