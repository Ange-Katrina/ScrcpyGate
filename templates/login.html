<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ScrcpyGate 登录</title>
  <style>
    :root { color-scheme: dark; --bg:#111421; --panel:#1d2130; --line:#33384d; --text:#eef2ff; --muted:#9aa3b8; --primary:#1a73e8; --danger:#ff6b6b; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:linear-gradient(145deg,#10131d,#1b1e30); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    main { width:min(420px, calc(100vw - 32px)); padding:28px; border:1px solid var(--line); background:rgba(29,33,48,.96); border-radius:8px; box-shadow:0 24px 70px rgba(0,0,0,.35); }
    h1 { margin:0 0 8px; font-size:24px; font-weight:700; letter-spacing:0; }
    p { margin:0 0 24px; color:var(--muted); line-height:1.5; }
    label { display:block; margin:14px 0 8px; color:var(--muted); font-size:13px; }
    input { width:100%; height:44px; padding:0 12px; border:1px solid var(--line); border-radius:6px; background:#25293a; color:var(--text); font-size:16px; outline:none; }
    input:focus { border-color:var(--primary); }
    button { width:100%; height:44px; margin-top:20px; border:0; border-radius:6px; background:var(--primary); color:white; font-weight:700; font-size:15px; cursor:pointer; }
    .error { margin:0 0 16px; padding:10px 12px; border:1px solid rgba(255,107,107,.4); background:rgba(255,107,107,.12); color:#ffd1d1; border-radius:6px; }
  </style>
</head>
<body>
  <main>
    <h1>ScrcpyGate</h1>
    <p>登录后选择设备投屏并获取控制权。</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post" action="/login">
      <label for="username">用户名</label>
      <input id="username" name="username" autocomplete="username" autofocus required>
      <label for="password">密码</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">登录</button>
    </form>
  </main>
</body>
</html>
